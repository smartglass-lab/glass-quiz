<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="世界の地理に挑戦するクイズWebApp。10問に答えてハイスコアを目指そう。">
  <meta name="mrbd-web-app-capable" content="yes">
  <title>グラスクイズ</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- ============ ホーム画面 ============ -->
    <div id="home" class="screen">
      <header class="header">
        <h1>グラスクイズ</h1>
        <span class="header-meta" id="status-indicator">Ready</span>
      </header>
      <div class="content">
        <div class="intro">
          <div class="intro-icon">🌍</div>
          <p class="intro-text">世界の地理に挑戦！<br>10問答えてハイスコアを目指そう。</p>
        </div>
        <div class="data-grid">
          <div class="mini-card">
            <div class="mini-label">ハイスコア</div>
            <div class="mini-value" id="home-highscore">0 / 10</div>
          </div>
          <div class="mini-card">
            <div class="mini-label">直近の結果</div>
            <div class="mini-value" id="home-lastscore">--</div>
          </div>
        </div>
        <div id="home-error" class="error-container hidden">
          <div class="error-icon">⚠️</div>
          <div class="error-message">問題を取得できませんでした。電波の良い場所でもう一度お試しください。</div>
        </div>
      </div>
      <nav class="nav-bar">
        <button class="nav-item primary focusable" data-action="start-quiz">▶ スタート</button>
      </nav>
    </div>

    <!-- ============ クイズ画面 ============ -->
    <div id="quiz" class="screen hidden">
      <header class="header">
        <span class="header-meta" id="quiz-progress">第 1 / 10 問</span>
        <span class="header-meta" id="quiz-score">正解 0</span>
      </header>
      <div class="content">
        <div class="quiz-meta">
          <span class="badge" id="quiz-category">Category</span>
          <span class="badge" id="quiz-difficulty">easy</span>
        </div>
        <div class="quiz-question" id="quiz-question">Loading question…</div>
        <div class="list-container" id="quiz-answers"></div>
      </div>
    </div>

    <!-- ============ 結果画面 ============ -->
    <div id="result" class="screen hidden">
      <header class="header">
        <h1>結果発表</h1>
      </header>
      <div class="content result-content">
        <div class="result-icon" id="result-icon">🎉</div>
        <div class="result-score" id="result-score">0 / 10</div>
        <div class="result-message" id="result-message"></div>
        <div id="result-badge" class="badge badge-highscore hidden">🏆 ハイスコア更新！</div>
      </div>
      <nav class="nav-bar">
        <button class="nav-item primary focusable" data-action="start-quiz">↻ もう一度</button>
        <button class="nav-item focusable" data-action="go-home">← もどる</button>
      </nav>
    </div>
  </div>

  <div id="loading" class="loading-container hidden">
    <div class="loading-spinner"></div>
    <div class="loading-text">問題を取得中…</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
